<!DOCTYPE html>
<html>
<head>
    <title>Google Maps Test</title>
    <style>
        #map {
            height: 400px;
            width: 100%;
            border: 2px solid red; /* So we can see the container */
        }
    </style>
</head>
<body>
    <h1>Simple Google Maps Test</h1>
    <div id="map"></div>
    
    <script>
        function initMap() {
            console.log('🗺️ Test initMap called');
            
            const map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 40.7128, lng: -74.0060 }, // NYC
                zoom: 13,
                mapTypeId: 'roadmap'
            });
            
            console.log('✅ Map created');
            
            // Add a marker
            new google.maps.Marker({
                position: { lat: 40.7128, lng: -74.0060 },
                map: map,
                title: 'Test Marker'
            });
            
            console.log('✅ Marker added');
        }
    </script>
    
    <!-- Direct Google Maps API call -->
    <script async defer 
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDjQjGwU0QXo_VxQfuGvYJvHsuUgPbaqsU&callback=initMap">
    </script>
</body>
</html>
