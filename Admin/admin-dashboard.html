<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaX Motosport - Admin Dashboard</title>
    <link rel="stylesheet" href="admin-dashboard.css">
    <link rel="stylesheet" href="/Newsletter/newsletter.css">
    <script defer src="/header-footer/header-footer.js"></script>
    <script defer src="/Newsletter/newsletter.js"></script>
    <script defer src="admin-dashboard.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>
    <h1>Admin Dashboard</h1>

    <div>
        <button id="toggle-newsletter">Toggle Newsletter Subscribers</button>
        <button id="toggle-orders">Toggle Orders</button>
    </div>

    <!-- Newsletter Section -->
    <div id="newsletter-section" class="hidden">
        <h2>Newsletter Subscribers</h2>
        <table id="newsletter-table">
            <thead>
                <tr>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Newsletter subscribers will be dynamically loaded here -->
            </tbody>
        </table>
        <form id="add-subscriber-form">
            <input type="email" id="new-subscriber-email" placeholder="Enter email" required />
            <button type="submit">Add Subscriber</button>
        </form>
        <p>Total Subscribers: <span id="subscriber-count">0</span></p>
    </div>

    <!-- Orders Section -->
    <div id="orders-section" class="hidden">
        <h2>Orders</h2>
        <table id="orders-table">
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>User ID</th>
                    <th>Total Price</th>
                    <th>Order Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Orders will be dynamically loaded here -->
            </tbody>
        </table>
    </div>

    <div id="footer-placeholder"></div>
</body>
</html>
